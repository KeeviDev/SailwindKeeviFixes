[config]
schemaVersion = "0.0.1"

[package]
namespace = "Keevi"
name = "KeeviFixes"
versionNumber = "1.0.1"
description = "A mod that contains a collection of fixes for bugs and rough edges in the base game"
websiteUrl = "https://github.com/KeeviDev/SailwindKeeviFixes"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../attachments/icon.png"
readme = "../bin/Thunderstore/README.md"
outdir = "../bin/Publish"

[[build.copy]]
source = "../bin/Release/KeeviFixes.dll"
target = "KeeviFixes/KeeviFixes.dll"

[[build.copy]]
source = "../CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["sailwind"]

[publish.categories]
sailwind = ["mods"]
